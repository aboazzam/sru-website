housing:
  section_label: "University Housing"
  title: "Safe & Comfortable On-Campus Living"
  description: "SRU provides fully serviced residential units on campus for students from outside the region, equipped with all the facilities needed for a comfortable and safe academic environment."
  eligibility_criteria:
    - "Enrolled full-time in a degree programme"
    - "Residing more than 100 km from campus"
    - "Applying at least 30 days before semester start"
    - "Committing to residential rules and regulations"
  buttons:
    - label: "Apply for Housing"
      style: primary
    - label: "Contact Housing Office"
      style: outline
  details_card:
    title: "Housing Details"
    subtitle: "Academic Year 2026-2027"
    info:
      - label: "Total Residential Units"
        value: "1,200"
      - label: "Stay Duration"
        value: "Per semester / Full year"
      - label: "Location"
        value: "On-Campus"
      - label: "Support Hotline"
        value: "+966 16 583 0210"
      - label: "Email"
        value: "housing@sru.edu.sa"
