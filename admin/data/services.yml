hajj:
  section_label: "Religious Responsibility Unit"
  title: "Supported University Hajj Programme"
  description: "Sulaiman Al-Rajhi University organises an annual Hajj trip for eligible students in coordination with the Ministry of Hajj and Umrah, covering transportation, accommodation, and full religious supervision — a reflection of the university's Islamic values and commitment to students' spiritual growth."
  eligibility_criteria:
    - "Performing Hajj for the first time (not previously performed)"
    - "Enrolled student with no active disciplinary record"
    - "Completed at least two semesters at the university"
    - "Full availability for the duration of the Hajj programme"
    - "Submitting application within the designated window before the Hajj season"
  buttons:
    - label: "Register via Portal"
      style: primary
    - label: "Contact Religious Unit"
      style: outline
  details_card:
    title: "Hajj Programme Details"
    subtitle: "Session 1447 AH"
    info:
      - label: "Annual Seats Available"
        value: "150"
      - label: "Registration Window"
        value: "Ramadan each year"
      - label: "Student Fee"
        value: "Fully subsidised"
      - label: "Email"
        value: "hajj@sru.edu.sa"
    whats_included:
      - "Round-trip transport from campus to Makkah Al-Mukarramah"
      - "Accommodation in Mina, Arafat and the holy sites"
      - "Specialist religious supervision by university scholars"
      - "Pre-departure orientation and spiritual preparation sessions"

financial_aid:
  section_label: "Financial Aid & Scholarships Office"
  title: "Don't Let Finances Hold Back Your Excellence"
  description: "SRU's Financial Aid & Scholarships Office offers a diverse range of grants, fee waivers and interest-free loans, ensuring every eligible student receives the right support to complete their academic journey without financial worry."
  general_requirements:
    - "Enrolled student in good academic standing (GPA ≥ 2.0)"
    - "Submitting proof of financial need documents (for need-based aid)"
    - "Not receiving a duplicate government scholarship"
    - "Annual renewal with continued eligibility compliance"
  buttons:
    - label: "Apply Now"
      style: primary
    - label: "Enquiry"
      style: outline
  available_support_card:
    title: "Available Support"
    subtitle: "Academic Year 2026-2027"
