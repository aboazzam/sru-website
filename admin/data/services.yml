      period: "/ semester"
      features:
        - "Free Wi-Fi"
        - "Central A/C"
        - "2 desks & 2 wardrobes"
        - "Shared bathroom"
    - type: "Studio Unit"
      price: "2,600 SAR"
      period: "/ semester"
      features:
        - "Kitchenette"
        - "Private lounge area"
        - "Private bathroom"
        - "Extended workspace"
    - type: "Family Unit"
      price: "3,500 SAR"
      period: "/ semester"
      features:
        - "2 bedrooms"
        - "Fully equipped kitchen"
        - "Independent living room"
        - "For married students"

transportation:
  section_label: "Transportation Service"
  title: "A Modern Fleet Connecting You Everywhere"
  description: "The university's Transportation Department operates a fleet of modern air-conditioned buses throughout the week during the academic term, serving the city's main districts, the airport, and facilities near campus."
  subscription_requirements:
