  title: "Your University, Fully Digital at SRU"
  description: "Everything you need — from registration and grades to services and support — available at your fingertips through a fully integrated digital ecosystem designed for an exceptional student experience."
  buttons:
    - label: "Student Portal"
      style: outline
    - label: "Download App"
      style: primary

