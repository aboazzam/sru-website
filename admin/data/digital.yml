student_portal:
  section_label: "STUDENT PORTAL"
  title: "Your Complete Digital Control Centre"
  description: "SRU's student portal is your gateway to everything — designed with a clean interface and seamless experience that makes managing your academic life effortless."
  features:
    - title: "Personal Dashboard"
      description: "A full view of your schedule, grades, notifications, and everything personal — all on one customised page."
      tags:
        - "Personalised"
        - "Real-Time"
    - title: "Course Registration"
      description: "Register your courses easily, view your study plan, and manage add/drop within the adjustment window."
      tags:
        - "Study Plan"
        - "Add/Drop"
    - title: "Grades & Performance Tracking"
      description: "View your grades instantly once recorded, track your GPA, and see your progress across all semesters."
      tags:
        - "Live GPA"
        - "Charts"
    - title: "Electronic Payments"
      description: "Pay tuition and service fees securely through the payment gateway, with a full record of all your financial transactions."
      tags:
        - "Mada / Visa"
        - "Instant Receipts"
    - title: "Notifications & Messaging"
      description: "Receive instant notifications from faculty and administration, and communicate through the integrated internal messaging system."
      tags:
        - "Push Alerts"
        - "Internal Mail"
    - title: "Digital Requests & Transactions"
      description: "Submit administrative requests electronically — certificates, official documents, leave, and graduation requests — without visiting the admin office."
      tags:
        - "Paperless"
        - "Track Status"

academic_systems:
  title: "Integrated Systems for Every Academic Need"
  description: "A sophisticated suite of interconnected academic systems delivering a seamless and complete digital learning experience."
  systems:
    - title: "Learning Management System (LMS)"
      description: "Full access to lectures, materials, assignments, and online exams through Blackboard, fully integrated with the student portal."
      cta: "Access LMS →"
    - title: "Registration & Scheduling System"
      description: "Course registration, weekly schedule view, and intelligent conflict management with recommendations tailored to your study plan."
      cta: "Register Now →"
    - title: "Grades & GPA System"
      description: "View grades instantly after recording, calculate cumulative and semester GPA, and track graduation status and remaining requirements."
      cta: "View Grades →"
    - title: "Digital Library"
      description: "Access to over 500,000 digital resources — books, scientific journals, research papers, and global academic databases."
      cta: "Explore Library →"
    - title: "Academic Advising System"
      description: "Book advising sessions with your academic advisor and receive intelligent recommendations for course and career pathway selection."
      cta: "Book Session →"
    - title: "Assessment & E-Exam System"
      description: "Take your electronic exams securely via an anti-cheat-resistant platform, with automated scheduling and instant result display."
      cta: "Access Exams →"

