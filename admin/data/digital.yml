mobile_app:
  section_label: "SRU MOBILE APP"
  title: "Your University in Your Pocket — Anywhere"
  description: "The SRU mobile app gives you quick access to everything you need, anywhere and anytime, with a smooth design and exceptional user experience."
  features:
    - title: "Schedule & Timetable"
      description: "View your daily and weekly timetable with smart alerts before every lecture."
    - title: "Live Grades & GPA"
      description: "Grades appear the moment they're recorded, with an interactive cumulative GPA indicator."
    - title: "Push Notifications"
      description: "Never miss a message from faculty or administration — customisable instant push notifications."
    - title: "Mobile Payments"
      description: "Pay your fees and requests directly from the app securely via Mada and credit cards."
    - title: "Campus Map & Navigation"
      description: "An interactive campus map with smart navigation to find lecture halls, offices, and facilities."
  download_buttons:
    - store: "App Store"
      platform: "iOS"
    - store: "Google Play"
      platform: "Android"

it_support:
  section_label: "IT SUPPORT"
  title: "Round-the-Clock Technical Support Team"
  description: "Whatever technical issues you face, SRU's support team is ready to help through multiple channels, ensuring your issue is resolved in the shortest possible time."
  channels:
    - title: "Help Desk"
      description: "Connect directly with the technical support team by phone or in person at the Support Desk inside campus."
      details:
        - "+966 16 583 0300"
        - "24/7, 7 days a week"
      cta: "Call Now"
    - title: "Live Chat"
      description: "Chat with a technical support agent in real time through the integrated chat system in the portal or app."
      details:
        - "Avg. wait under 2 minutes"
        - "it-chat@sru.edu.sa"
      cta: "Start Chat"
    - title: "Knowledge Base"
      description: "Over 500 articles and detailed guides for self-resolving common issues — available 24/7 without any waiting."
      details:
        - "500+ Articles"
        - "Smart Search"
      cta: "Browse Knowledge Base"

cta:
  title: "Start Your SRU Digital Experience Today"
  description: "Log in to your student portal or download the app and take control of every aspect of your academic journey at the touch of a button."
  buttons:
    - label: "Access Portal"
      style: primary
    - label: "Download App"
      style: outline

