university_role:
  section_label: "UNIVERSITY'S ROLE"
  title: "A Foundation Stone in Community Building"
  description: "Sulaiman Al-Rajhi University plays a pivotal role in advancing sustainable local development across Al-Qassim and the Kingdom, through targeted programs that strengthen partnerships between the university, government bodies, the private sector, and civil society. We believe the university is not merely an educational institution, but an engine for social and economic transformation — preparing graduates capable of leading development and serving their nation."
  badge: "Ministry of Education Certified"
  pillars:
    - icon: "community"
      title: "Community Engagement"
      description: "Programs connecting the university with surrounding communities"
    - icon: "clock"
      title: "Sustainable Development"
      description: "Initiatives supporting Vision 2030 sustainability goals"
    - icon: "research"
      title: "Applied Research"
      description: "Research addressing real local community challenges"
    - icon: "shield"
      title: "Values & Responsibility"
      description: "Cultivates a culture of giving and social responsibility"

