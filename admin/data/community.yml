  section_label: "TOTAL IMPACT"
  title: "Numbers That Reflect Our Community Journey"
  stats:
    - value: "4,700+"
      label: "Annual Volunteers"
    - value: "28,000+"
      label: "Volunteer Hours"
    - value: "65+"
      label: "Community Partners"
    - value: "30+"
