events_partnerships:
  section_label: "EVENTS & PARTNERSHIPS"
  title: "Events That Unite Campus and Community"
  description: "We host and participate in dozens of community events annually, strengthening collaboration and creating real value for the Al-Qassim region and beyond."
  events:
    - date: "Mar 2026"
      category: "Environment"
      title: "Al-Qassim Green Day"
      description: "A mass tree-planting campaign uniting the university with Al-Bukayriyah Municipality and private-sector partners to plant over 5,000 trees."
      location: "University Campus, Al-Bukayriyah"
      color: "green"
    - date: "Apr 2026"
      category: "Education"
      title: "Parents & Community Forum"
      description: "An annual forum bringing together students' families with faculty and university leadership to strengthen communication and build community trust."
      location: "Main Conference Hall"
      color: "blue"
    - date: "May 2026"
      category: "Health"
      title: "Community Health Caravan"
      description: "A medical caravan led by medicine students and faculty, offering free health screenings and awareness services to the community."
      location: "Al-Qassim Region Governorates"
      color: "orange"
    - date: "Jun 2026"
      category: "Technology"
      title: "Digital Community Hackathon"
      description: "An open hackathon bringing university students and young community members together to innovate tech solutions for real local problems."
      location: "Innovation Lab, University"
      color: "purple"
    - date: "Sep 2026"
      category: "Economy"
      title: "Local Entrepreneurship Forum"
      description: "A forum linking local entrepreneurs with university experts and private-sector investors to empower the local economy."
      location: "Business & Innovation Center"
      color: "teal"
    - date: "Nov 2026"
      category: "Culture"
      title: "Heritage & Creativity Festival"
      description: "A celebration of Saudi cultural heritage and youth creativity, bringing together artists, craftspeople, and students in an exceptional community event."
      location: "University Main Plaza"
      color: "red"

partners:
  section_label: "OUR PARTNERS"
  title: "Partnerships That Make a Difference"
  description: "We collaborate with government bodies, private institutions, and international organizations to maximize community impact."
  partner_list:
    - "Ministry of Education"
    - "Qassim Municipality"
    - "Saudi Aramco"
    - "Al-Rajhi Group"
    - "Community Service Program"
    - "Al-Birr Charity Assoc."
    - "Al-Nahda Schools"
    - "King Saud Hospital"

volunteer_programs:
  section_label: "VOLUNTEER PROGRAMS"
  title: "Be Part of the Change"
  description: "The university enables students and staff to participate in organised volunteer programs that develop skills and serve the community simultaneously."
  programs:
    - icon: "phone"
      title: "Community Awareness"
      description: "Awareness campaigns in schools and residential areas covering health, environment, and values topics."
      volunteers: "2,000+"
      schedule: "Year-round"
    - icon: "book"
      title: "Education Support"
      description: "Extra tutoring for students in neighbouring schools and adult literacy programs for the local community."
      volunteers: "850+"
      schedule: "Each Semester"
    - icon: "home"
      title: "Social Assistance"
      description: "Supporting families in need through food distribution and provision of essential social services."
      volunteers: "1,500+"
      schedule: "Multiple Events"
    - icon: "heartbeat"
      title: "Healthcare Volunteering"
      description: "Healthcare programs delivered by medicine and nursing students at local health centres and hospitals."
      volunteers: "800+"
      schedule: "Year-round"
    - icon: "star"
      title: "Sports Excellence"
      description: "Athletic training for young community members across various sports disciplines using the university's world-class facilities."
      volunteers: "300+"
      schedule: "Summer Break"
    - icon: "globe"
      title: "International Volunteering"
      description: "International volunteer programs allowing students to participate in humanitarian projects outside the Kingdom through partnerships with global organisations."
      volunteers: "150+"
      schedule: "Annually"
  cta_buttons:
    - label: "Register as Volunteer"
      style: primary
    - label: "Explore Programs"
      style: outline

social_responsibility:
  section_label: "SOCIAL RESPONSIBILITY"
  title: "Initiatives That Create Real Impact"
  description: "Sulaiman Al-Rajhi University commits sustained resources to comprehensive social initiatives addressing local development priorities."
  initiatives:
    - icon: "shield"
      title: "Merit Scholarship Fund"
      description: "A scholarship fund financing the education of high-achieving students from limited-income families, ensuring equal opportunities in higher education."
      stats:
        - value: "800+"
          label: "Annual Beneficiaries"
        - value: "40M+"
          label: "SAR Disbursed"
    - icon: "home"
      title: "Community Housing Project"
      description: "Collaboration with government authorities to renovate and maintain dilapidated homes in villages surrounding the Al-Qassim region."
      stats:
        - value: "120+"
          label: "Homes Renovated"
        - value: "600+"
          label: "Direct Beneficiaries"
    - icon: "leaf"
      title: "Environmental Sustainability"
      description: "Solar energy, recycling, and water conservation programs within the campus and their extension toward the surrounding community."
      stats:
        - value: "30%"
          label: "Carbon Footprint Reduction"
        - value: "5,000+"
          label: "Trees Planted"
    - icon: "heartbeat"
      title: "Community Healthcare"
      description: "Mobile clinics and medical units providing free preventive and curative services to rural areas and underserved populations."
      stats:
        - value: "12,000+"
          label: "Patients Treated"
        - value: "24"
          label: "Service Centers"
    - icon: "briefcase"
      title: "SME Support Program"
      description: "A program delivering business consulting and technical support to small and medium enterprises in the Al-Qassim region."
      stats:
        - value: "200+"
          label: "Businesses Supported"
        - value: "85%"
          label: "Success Rate"
    - icon: "globe"
      title: "Community Digital Literacy"
      description: "Training community members in basic digital skills, e-commerce, and coding in the university's advanced labs."
      stats:
        - value: "3,500+"
          label: "Trainees"
        - value: "40+"
          label: "Courses Annually"

