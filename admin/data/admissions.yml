faqs:
  section_label: "FREQUENTLY ASKED QUESTIONS"
  title: "Got Questions? We Have Answers."
  items:
    - question: "When does the admissions portal open?"
      answer: "The portal opens each year in Muharram for the following academic year. Check the academic calendar for exact dates."
    - question: "Can I apply to more than one program?"
      answer: "Yes, you may apply to up to three programs in order of preference. Admission is granted to the highest-priority program you qualify for."
    - question: "Is there an entrance exam?"
      answer: "Most programs require valid Qudurat and Tahsili scores. Some programs (e.g., Medicine) also require an interview."
    - question: "How long does the application review take?"
      answer: "Applications are typically reviewed within 10–15 working days. You will be notified via the portal and email."
    - question: "Are scholarships available for new students?"
      answer: "Yes. Merit-based and need-based scholarships are available. Apply through the Financial Aid Office after receiving your offer."

