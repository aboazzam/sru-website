page: student-journey

hero:
  title: "Your Academic Journey at SRU"
  description: "From your very first steps as a prospective student to the proud moment of graduation — we walk every stage with you, providing the support, guidance, and tools you need to achieve your ambitions."
  button_primary: "Explore the Stages"
  button_secondary: "Start Admissions"

