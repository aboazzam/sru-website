stages_section:
  tag: "THE FOUR STAGES"
  title: "Your Complete Academic Journey"
  description: "Each stage is carefully designed to prepare you for the next and empower you to reach your full potential."

stages:
  - number: "01"
    id: "prospective"
    title: "Prospective Student"
    keywords: "Explore · Discover · Plan"
    description: "This is where it all begins — discover our academic programs, visit our beautiful campus, and connect with current students to find out how Sulaiman Al-Rajhi University can transform your future."
    button_primary: "Explore Programs"
    button_secondary: "Admissions Info"
    activities_title: "WHAT YOU'LL DO AT THIS STAGE"
    activities:
      - title: "Explore Colleges & Programs"
        description: "Browse 80+ academic programs"
      - title: "Take a Virtual Campus Tour"
        description: "View our world-class facilities"
      - title: "Attend an Open Day"
        description: "Meet faculty and current students"
      - title: "Speak with an Academic Advisor"
        description: "Get free personalised guidance"
      - title: "Review Admission Requirements"
        description: "Check your chosen program's criteria"
    cta:
      title: "Begin Your Admissions Journey"
      subtitle: "Apply online in minutes"

  - number: "02"
    id: "applicant"
    title: "Applicant"
    keywords: "Apply · Await · Prepare"
    description: "Submit your application and prepare for the next chapter. Our admissions team will guide you through every step of the process."
    button_primary: "Start Application"
    button_secondary: "Check Requirements"
    activities_title: "WHAT YOU'LL DO AT THIS STAGE"
    activities:
      - title: "Submit Your Application"
        description: "Complete the online application form"
      - title: "Upload Required Documents"
        description: "Transcripts, ID, and supporting materials"
      - title: "Track Application Status"
        description: "Monitor your application in real time"
      - title: "Attend an Interview"
        description: "If required for your chosen program"
      - title: "Receive Your Offer Letter"
        description: "Accept your place at SRU"
    cta:
      title: "Ready to Apply?"
      subtitle: "Start your application today"

  - number: "03"
    id: "student"
    title: "Current Student"
    keywords: "Learn · Grow · Excel"
    description: "Immerse yourself in academic life at SRU. Access world-class resources, join student clubs, and build the skills that will define your career."
    button_primary: "Student Portal"
    button_secondary: "Academic Calendar"
    activities_title: "WHAT YOU'LL DO AT THIS STAGE"
    activities:
      - title: "Attend Classes & Lectures"
        description: "Engage with expert faculty"
      - title: "Access the Digital Library"
        description: "Thousands of academic resources"
      - title: "Join Student Clubs"
        description: "Over 50 clubs and activities"
      - title: "Get Academic Advising"
        description: "Plan your path to graduation"
      - title: "Apply for Scholarships"
        description: "Financial support opportunities"
    cta:
      title: "Access Student Services"
      subtitle: "Everything you need in one place"

  - number: "04"
    id: "graduate"
    title: "Graduate"
    keywords: "Graduate · Excel · Lead"
    description: "Join a proud community of SRU alumni making a difference across every field. Your journey doesn't end at graduation — it's just the beginning."
    button_primary: "Alumni Network"
    button_secondary: "Career Services"
    activities_title: "WHAT YOU'LL DO AT THIS STAGE"
    activities:
      - title: "Attend Graduation Ceremony"
        description: "Celebrate your achievement"
      - title: "Join the Alumni Network"
        description: "Connect with 10,000+ graduates"
      - title: "Access Career Services"
        description: "Job placement and career guidance"
      - title: "Continue Your Education"
        description: "Postgraduate programs available"
      - title: "Give Back to SRU"
        description: "Mentor future students"
    cta:
      title: "Join Our Alumni Community"
      subtitle: "Stay connected with SRU"

