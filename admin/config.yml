backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "الصفحة الرئيسية"
    files:
      - name: "home"
        label: "بيانات الصفحة الرئيسية"
        file: "admin/data/home.json"
        fields:
          - label: "الأخبار"
            name: "news"
            widget: "list"
            fields:
              - { label: "العنوان بالعربي", name: "title_ar", widget: "string" }
              - { label: "العنوان بالإنجليزي", name: "title_en", widget: "string" }
              - { label: "النص بالعربي", name: "body_ar", widget: "text" }
              - { label: "النص بالإنجليزي", name: "body_en", widget: "text" }
              - { label: "الصورة", name: "image", widget: "image", required: false }
              - { label: "النوع", name: "type", widget: "select", options: ["news", "event", "announcement"] }
              - { label: "التاريخ", name: "date", widget: "datetime" }
              - { label: "اللون", name: "color", widget: "color", default: "#003366" }
