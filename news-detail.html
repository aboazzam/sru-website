<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News — Sulaiman Al-Rajhi University</title>
  <meta name="theme-color" content="#3D1F6E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/pages.css" />
  <link rel="stylesheet" id="rtl-stylesheet" href="styles/rtl.css" disabled />

  <style>
    .detail-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-purple);
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 32px;
      transition: gap .2s;
    }
    .detail-back:hover { gap: 10px; }
    .detail-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .detail-type {
      background: var(--color-purple);
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: .4px;
    }
    .detail-date {
      color: #888;
      font-size: .88rem;
    }
    .detail-title {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.3;
      margin-bottom: 24px;
    }
    .detail-img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 32px;
      display: block;
    }
    .detail-img-placeholder {
      width: 100%;
      height: 280px;
      border-radius: 14px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
    }
    .detail-body {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #374151;
      white-space: pre-line;
    }
    .detail-body:empty::before {
      content: attr(data-fallback);
      color: #9CA3AF;
    }
    .detail-divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 40px 0;
    }
    .detail-loading {
      text-align: center;
      padding: 80px 24px;
      color: #9CA3AF;
      font-size: 1rem;
    }
    .detail-not-found {
      text-align: center;
      padding: 80px 24px;
    }
    .detail-not-found h2 { font-size: 1.4rem; color: #374151; margin-bottom: 12px; }
    .detail-not-found p  { color: #9CA3AF; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="SRU Home">
      <div class="logo-mark">
        <img src="assets/sru-logo.png" alt="Sulaiman Al-Rajhi University logo">
      </div>
    </a>
    <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="index.html"              class="nav-link"        data-ar="الرئيسية"        data-en="Home">Home</a></li>
        <li><a href="student-journey.html"    class="nav-link"        data-ar="رحلة الطالب"     data-en="Student Journey">Student Journey</a></li>
        <li><a href="admissions.html"         class="nav-link"        data-ar="القبول"           data-en="Admissions">Admissions</a></li>
        <li><a href="scholarships.html"       class="nav-link"        data-ar="المنح الدراسية"   data-en="Scholarships">Scholarships</a></li>
        <li><a href="campus-life.html"        class="nav-link"        data-ar="الحياة الجامعية" data-en="Campus Life">Campus Life</a></li>
        <li><a href="services.html"           class="nav-link"        data-ar="الخدمات"          data-en="Services">Services</a></li>
        <li><a href="digital-experience.html" class="nav-link"        data-ar="الرقمي"           data-en="Digital">Digital</a></li>
        <li><a href="alumni.html"             class="nav-link"        data-ar="الخريجون"         data-en="Alumni">Alumni</a></li>
        <li><a href="community.html"          class="nav-link"        data-ar="المجتمع"          data-en="Community">Community</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle" aria-label="Toggle language">
        <span class="lang-label" id="lang-label">العربية</span>
      </button>
      <a href="https://sr.edu.sa/site/ar/%d8%a7%d9%84%d8%aa%d8%ad%d9%82-%d8%a7%d9%84%d8%a7%d9%86/"
         class="btn btn-primary btn-sm"
         data-ar="قدّم الآن" data-en="Apply Now"
         target="_blank" rel="noopener noreferrer">Apply Now</a>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="primary-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div class="nav-overlay" id="nav-overlay"></div>
</header>

<!-- CONTENT -->
<main style="padding-top: var(--header-h);">
  <div class="detail-wrap" id="detail-wrap">
    <div class="detail-loading" id="detail-loading">
      <p data-ar="جارٍ تحميل الخبر..." data-en="Loading article...">Loading article...</p>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container footer-bottom-inner">
      <p class="copyright" data-ar="© 2026 جامعة سليمان الراجحي. جميع الحقوق محفوظة." data-en="© 2026 Sulaiman Al-Rajhi University. All rights reserved.">
        © 2026 Sulaiman Al-Rajhi University. All rights reserved.
      </p>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
(function () {
  var MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function getLang() {
    return document.documentElement.lang === 'ar' ? 'ar' : 'en';
  }

  function formatDate(item) {
    if (item.day && item.month_ar) {
      return getLang() === 'ar'
        ? item.day + ' ' + item.month_ar
        : item.day + ' ' + item.month_en;
    }
    if (item.date) {
      var d = new Date(item.date + 'T00:00:00');
      return getLang() === 'ar'
        ? d.getDate() + ' ' + MONTHS_AR[d.getMonth()] + ' ' + d.getFullYear()
        : MONTHS_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    return '';
  }

  function render(item) {
    var lang    = getLang();
    var title   = lang === 'ar' ? (item.title_ar   || item.titleAr   || '') : (item.title_en   || item.titleEn   || '');
    var body    = lang === 'ar' ? (item.body_ar    || item.bodyAr    || item.excerpt_ar || '') : (item.body_en || item.bodyEn || item.excerpt_en || '');
    var type    = lang === 'ar' ? (item.type_ar    || 'خبر')  : (item.type_en  || 'News');
    var dateStr = formatDate(item);
    var color   = item.color || 'linear-gradient(135deg,#3D1F6E 0%,#6B46C1 100%)';
    var backLabel = lang === 'ar' ? '→ العودة للأخبار' : '← Back to News';

    var imgHtml = item.image
      ? '<img class="detail-img" src="' + item.image + '" alt="' + title + '">'
      : '<div class="detail-img-placeholder" style="background:' + color + '">' + type + '</div>';

    document.title = title + ' — SRU';

    document.getElementById('detail-wrap').innerHTML =
      '<a href="index.html#news" class="detail-back">' + backLabel + '</a>' +
      '<div class="detail-meta">' +
        '<span class="detail-type">' + type + '</span>' +
        '<span class="detail-date">' + dateStr + '</span>' +
      '</div>' +
      '<h1 class="detail-title">' + title + '</h1>' +
      imgHtml +
      '<div class="detail-body">' + (body || '') + '</div>' +
      '<hr class="detail-divider">' +
      '<a href="index.html#news" class="detail-back">' + backLabel + '</a>';
  }

  function showNotFound() {
    var lang = getLang();
    document.getElementById('detail-wrap').innerHTML =
      '<div class="detail-not-found">' +
        '<h2>' + (lang === 'ar' ? 'الخبر غير موجود' : 'Article Not Found') + '</h2>' +
        '<p>' + (lang === 'ar' ? 'لم يتم العثور على هذا الخبر.' : 'This article could not be found.') + '</p>' +
        '<br><a href="index.html#news" class="btn btn-primary">' + (lang === 'ar' ? 'العودة للأخبار' : 'Back to News') + '</a>' +
      '</div>';
  }

  // قراءة الـ ID من الرابط
  var params = new URLSearchParams(window.location.search);
  var id     = params.get('id');

  if (!id) { showNotFound(); return; }

  fetch('admin/data/news.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var items = data.news || [];
      // مقارنة بـ string وبـ number (بعض الـ id أرقام وبعضها نصوص)
      var item = items.find(function(n) { return String(n.id) === String(id); });
      if (item) render(item);
      else showNotFound();
    })
    .catch(showNotFound);
})();
</script>
</body>
</html>
