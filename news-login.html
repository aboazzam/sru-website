<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول مزود الأخبار | SRU</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Noto Kufi Arabic', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#3D1F6E] to-[#1a0a33] flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 mb-4">
        <svg width="36" height="36" viewBox="0 0 44 44" fill="none">
          <circle cx="22" cy="22" r="22" fill="#3D1F6E"/>
          <path d="M10 30 L22 10 L34 30 Z" fill="none" stroke="#00B4C8" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M14 30 L22 16 L30 30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="22" cy="10" r="2.5" fill="#00B4C8"/>
        </svg>
      </div>
      <h1 class="text-white text-2xl font-bold">جامعة سليمان الراجحي</h1>
      <p class="text-white/60 text-sm mt-1">بوابة مزود الأخبار</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">

      <h2 class="text-[#3D1F6E] text-xl font-bold mb-6 text-center">تسجيل الدخول</h2>

      <!-- Error message -->
      <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg p-3 mb-4 text-center">
        اسم المستخدم أو كلمة المرور غير صحيحة
      </div>

      <form onsubmit="handleLogin(event)">
  <div class="space-y-4">
    <div>
      <label class="block text-sm mb-1">اسم المستخدم</label>
      <input id="username" type="text" class="input-class" placeholder="أدخل اسم المستخدم">
    </div>

    <div>
      <label class="block text-sm mb-1">كلمة المرور</label>
      <input id="password" type="password" class="input-class" placeholder="أدخل كلمة المرور">
    </div>
  </div>

  <button type="submit" class="btn-class w-full mt-6">
    دخول
  </button>
</form>
    </div>

    <p class="text-center text-white/40 text-xs mt-6">
      © 2026 جامعة سليمان الراجحي — للاستخدام الداخلي فقط
    </p>

  </div>

  <script>
// بيانات الدخول ____________________________________________
// غيّر هذه القيم حسب الحاجة
const CREDENTIALS = {
  username: "news_provider",
  password: "SRU@2026news"
};

// دالة تنفيذ تسجيل الدخول
function handleLogin(e) {
  e.preventDefault(); // منع إعادة تحميل الصفحة

  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();

  if (u === CREDENTIALS.username && p === CREDENTIALS.password) {
    // حفظ حالة الدخول ثم الانتقال للمحرّر
    sessionStorage.setItem('news_auth', '1');
    window.location.href = '/news-editor';
  } else {
    alert('اسم المستخدم أو كلمة المرور غير صحيحة');
  }
}

// لو المستخدم مسجّل دخول فعلاً لا نعيده لصفحة الدخول
if (sessionStorage.getItem('news_auth') === '1') {
  window.location.href = '/news-editor';
}
</script>
</body>
</html>
